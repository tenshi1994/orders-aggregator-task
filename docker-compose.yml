services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orders
    ports:
      - "5432:5432"
    volumes:
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql

  # Внешний API заказов (поддерживается другой командой). Образ приложен к заданию: docker load -i orders-mock-*.tar.gz
  orders-api:
    image: orders-mock:3
    ports:
      - "4000:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
